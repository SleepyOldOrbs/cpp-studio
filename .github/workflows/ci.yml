name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-amd64
            archive: dist/cpp-studio-linux-amd64.tar.gz
          - os: windows-latest
            runtime: windows-amd64
            archive: dist/cpp-studio-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt check
        shell: pwsh
        run: |
          $files = gofmt -l ./cmd ./internal
          if ($files) {
            $files
            throw "gofmt reported unformatted files"
          }

      - name: test
        run: go test ./... -count=1

      - name: vet
        run: go vet ./...

      - name: config check
        run: go run ./cmd/cpp-studio --config ./config.ci.json --check

      - name: fixture voice loop smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-voice-loop-fixture.ps1

      - name: package release archive
        shell: pwsh
        run: ./scripts/package-release.ps1 -Runtime ${{ matrix.runtime }}

      - name: upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: cpp-studio-${{ matrix.runtime }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
