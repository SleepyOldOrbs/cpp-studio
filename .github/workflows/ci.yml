name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-amd64
            archive: dist/cpp-studio-linux-amd64.tar.gz
          - os: windows-latest
            runtime: windows-amd64
            archive: dist/cpp-studio-windows-amd64.zip

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt check
        shell: pwsh
        run: |
          $files = gofmt -l ./cmd ./internal
          if ($files) {
            $files
            throw "gofmt reported unformatted files"
          }

      - name: test
        run: go test ./... -count=1

      - name: vet
        run: go vet ./...

      - name: config check
        run: go run ./cmd/cpp-studio --config ./config.ci.json --check

      - name: fixture voice loop smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-voice-loop-fixture.ps1

      - name: fixture story smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-story-fixture.ps1

      - name: fixture demo UI smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\smoke-demo-ui.ps1

      - name: package release archive
        shell: pwsh
        run: ./scripts/package-release.ps1 -Runtime ${{ matrix.runtime }}

      - name: verify release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $packageDir = Join-Path "dist" "cpp-studio-${{ matrix.runtime }}"
          $exe = if ("${{ matrix.runtime }}".StartsWith("windows")) { ".exe" } else { "" }
          & (Join-Path $packageDir "cpp-studio$exe") --config (Join-Path $packageDir "config.ci.json") --check
          & (Join-Path $packageDir "cpp-studio-fixture$exe") --help

      - name: upload release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cpp-studio-${{ matrix.runtime }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
